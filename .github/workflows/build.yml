name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build MSI/EXE
        run: .\gradlew :app:packageDistributionForCurrentOS --no-daemon --no-configuration-cache

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniLife-Windows-MSI
          path: app/build/compose/binaries/main/**/*.msi
          if-no-files-found: warn
      - name: Report biggest files in app image
        shell: pwsh
        run: |
          $dir = "app/build/compose/binaries/main/app"
          if (-not (Test-Path $dir)) { $dir = "app/build/compose/binaries/main" }
          Get-ChildItem $dir -Recurse -File |
            Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length/1MB), $_.FullName.Substring($dir.Length) }
          "runtime: {0:N0} MB" -f ((Get-ChildItem "$dir/*/runtime" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum/1MB)
      - name: Report size breakdown
        shell: pwsh
        run: |
          .\gradlew :app:createDistributable --no-daemon --no-configuration-cache
          $dir = (Get-ChildItem app/build/compose/binaries/main/app -Directory | Select-Object -First 1).FullName
          "== folders =="
          Get-ChildItem $dir -Directory | ForEach-Object {
            "{0,8:N1} MB  {1}" -f ((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum/1MB), $_.Name }
          "== top 25 files =="
          Get-ChildItem $dir -Recurse -File | Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length/1MB), $_.FullName.Substring($dir.Length) }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Get-ChildItem "$dir/app" -Filter *.jar | Sort-Object Length -Descending | Select-Object -First 3 | ForEach-Object {
            "== $($_.Name) ({0:N1} MB) ==" -f ($_.Length/1MB)
            [IO.Compression.ZipFile]::OpenRead($_.FullName).Entries | Sort-Object Length -Descending | Select-Object -First 8 |
              ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length/1MB), $_.FullName } }
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniLife-Windows-EXE
          path: app/build/compose/binaries/main/**/*.exe
          if-no-files-found: warn

  # Optional: publish to GitHub Releases on version tags
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: AniLife-Windows-MSI
          path: release-files

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: AniLife-Windows-EXE
          path: release-files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          generate_release_notes: true
